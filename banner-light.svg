  <circle cx="890" cy="103" r="5" fill="#9a6b00"/>
  <circle cx="890" cy="103" r="10" fill="none" stroke="#9a6b00" stroke-width="1" opacity="0.5"/>

  <!-- wordmark -->
  <text x="64" y="118" font-family="'Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif"
