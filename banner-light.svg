      <circle cx="672" cy="134" r="1.8"/><circle cx="737" cy="134" r="1.8"/><circle cx="802" cy="134" r="1.8"/><circle cx="867" cy="134" r="1.8"/><circle cx="932" cy="134" r="1.8"/><circle cx="997" cy="134" r="1.8"/><circle cx="1062" cy="134" r="1.8"/><circle cx="1127" cy="134" r="1.8"/>
      <circle cx="672" cy="180" r="1.8"/><circle cx="737" cy="180" r="1.8"/><circle cx="802" cy="180" r="1.8"/><circle cx="867" cy="180" r="1.8"/><circle cx="932" cy="180" r="1.8"/><circle cx="997" cy="180" r="1.8"/><circle cx="1062" cy="180" r="1.8"/><circle cx="1127" cy="180" r="1.8"/>
      <circle cx="672" cy="226" r="1.8"/><circle cx="737" cy="226" r="1.8"/><circle cx="802" cy="226" r="1.8"/><circle cx="867" cy="226" r="1.8"/><circle cx="932" cy="226" r="1.8"/><circle cx="997" cy="226" r="1.8"/><circle cx="1062" cy="226" r="1.8"/><circle cx="1127" cy="226" r="1.8"/>
