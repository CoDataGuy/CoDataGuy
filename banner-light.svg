    <circle cx="798" cy="140" r="3.6"/><circle cx="844" cy="158" r="3.6"/><circle cx="936" cy="128" r="3.6"/>
    <circle cx="982" cy="112" r="3.6"/><circle cx="1028" cy="155" r="3.6"/><circle cx="1074" cy="138" r="3.6"/>
